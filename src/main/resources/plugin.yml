name: ModelPackToggle
version: 1.2.1
main: jp.tutti.modelpacktoggle.ModelPackToggle
api-version: '1.21'
softdepend:
  - PlaceholderAPI
author: tutti
description: プレイヤーごとに任意リソースパックの適用を選べるようにする
commands:
  modelpack:
    description: モデルパックのON/OFFを切り替えます
    usage: /modelpack [on|off|toggle|status]
    permission: modelpack.use
permissions:
  modelpack.use:
    description: /modelpack を使う
    default: true
  modelpack.admin:
    description: 他プレイヤーの設定変更と reload
    default: op
