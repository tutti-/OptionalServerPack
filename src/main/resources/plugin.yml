name: OptionalServerPack
version: 2.0.0
main: jp.tutti.optionalserverpack.OptionalServerPack
api-version: '1.21'
softdepend:
  - PlaceholderAPI
author: tutti
description: プレイヤーごとに任意リソースパックの適用を選べるようにする
commands:
  optionalserverpack:
    description: 任意リソースパックのON/OFFを切り替えます
    usage: /optionalserverpack [on|off|toggle|status]
    permission: optionalserverpack.use
    aliases:
      - osp
      - serverpack
permissions:
  optionalserverpack.use:
    description: /optionalserverpack を使う
    default: true
  optionalserverpack.admin:
    description: 他プレイヤーの設定変更と reload
    default: op
